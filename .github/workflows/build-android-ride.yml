name: Build Android — Ride (master)

# Master push -> EAS Build (cloud) -> APK/AAB artifact + Sentry source map upload.
# Production submit ETMEZ — sadece Internal Testing track'e otomatik gönderilir
# (release-android-ride.yml git tag üzerinden manuel tetiklenir).
#
# Ride app için ayrı pipeline; fleet/** değişiklikleri tetiklemez.
#
# Required GitHub Secrets:
#   EXPO_EAS_TOKEN
#   SENTRY_AUTH_TOKEN
#   EXPO_PUBLIC_SUPABASE_URL
#   EXPO_PUBLIC_SUPABASE_ANON_KEY
#   EXPO_PUBLIC_SENTRY_DSN_RIDE
#   EXPO_PUBLIC_GOOGLE_MAPS_API_KEY      — ride app Maps key

on:
  push:
    branches: [master]
    paths:
      - 'ride/**'
      - '.github/workflows/build-android-ride.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

defaults:
  run:
    working-directory: ride

jobs:
  build-android-ride:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ride/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_EAS_TOKEN }}

      - name: Install deps
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build (EAS preview profile)
        if: github.event_name == 'push' || github.event.inputs.profile == 'preview'
        run: eas build --platform android --profile preview --non-interactive --no-wait
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN_RIDE: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN_RIDE }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: drivermesh
          SENTRY_PROJECT: drivermesh-ride

      - name: Build (EAS production profile)
        if: github.event.inputs.profile == 'production'
        run: eas build --platform android --profile production --non-interactive --no-wait
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN_RIDE: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN_RIDE }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: drivermesh
          SENTRY_PROJECT: drivermesh-ride

      - name: Build trigger summary
        run: |
          echo "## EAS Build queued (ride)" >> $GITHUB_STEP_SUMMARY
          echo "Profile: ${{ github.event.inputs.profile || 'preview' }}" >> $GITHUB_STEP_SUMMARY
          echo "Track: https://expo.dev/accounts/drivermesh/projects/drivermeshride/builds" >> $GITHUB_STEP_SUMMARY
