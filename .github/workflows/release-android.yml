name: Release Android (git tag)

# Git tag (v1.x.x) -> EAS production build + EAS submit Play Store internal track.
# Production rollout MANUEL (Google policy + safety) — Play Console'da
# "Submit for review" basilmadan kullanicilara gitmez.
#
# Trigger:
#   git tag v1.0.1 && git push --tags
#   veya GitHub UI -> Releases -> Draft a new release -> tag v1.0.1
#
# Workflow:
#   1. EAS production build (AAB, autoIncrement versionCode)
#   2. Sentry release tag + source map upload (otomatik via sentry.gradle)
#   3. EAS submit -> Play Store Internal Testing track (releaseStatus=draft)
#   4. Telegram bildirim (sen Play Console'a girip "Submit for review" basacaksin)

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_EAS_TOKEN }}

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Decode Play Service Account
        run: |
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" | base64 -d > google-play-service-account.json
          echo "Service account decoded"

      - name: Build production AAB
        run: eas build --platform android --profile production --non-interactive --wait
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY_ANDROID: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY_ANDROID }}
          EXPO_PUBLIC_TELEGRAM_SUPPORT_USERNAME: ${{ secrets.EXPO_PUBLIC_TELEGRAM_SUPPORT_USERNAME }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: drivermesh
          SENTRY_PROJECT: drivermesh-mobile

      - name: Submit to Play Store Internal Testing
        run: eas submit --platform android --latest --non-interactive
        env:
          # EAS CLI standart "EXPO_TOKEN" bekler; bizim secret adi
          # EXPO_EAS_TOKEN, alias env ile geciriyoruz.
          EXPO_TOKEN: ${{ secrets.EXPO_EAS_TOKEN }}

      - name: Telegram notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          TAG="${{ github.ref_name }}"
          MSG=":rocket: *DriverMesh Android $TAG* — *$STATUS*%0A%0AInternal Testing track'e gonderildi.%0AProd rollout icin Play Console -> Submit for review."
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=$MSG" \
              -d "parse_mode=Markdown"
          fi
