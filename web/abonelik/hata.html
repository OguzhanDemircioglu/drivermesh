<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0A0E1F" />
<title>Ödeme Tamamlanamadı — DriverMesh</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/assets/logo.png" />
<style>
  :root { --bg:#0A0E1F; --bg-elev:#131732; --text:#F4F5FA; --text-muted:#A6A9C2; --text-dim:#6B6F8E; --accent:#FF7A1A; --danger:#EF4444; --border:rgba(255,255,255,0.08); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; line-height: 1.6; }
  body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at 50% -10%, rgba(239,68,68,0.14), transparent 55%); pointer-events: none; }
  .box { position: relative; text-align: center; max-width: 440px; }
  .icon { width: 84px; height: 84px; border-radius: 50%; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35); display: flex; align-items: center; justify-content: center; margin: 0 auto 26px; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 12px; }
  p { color: var(--text-muted); font-size: 16px; margin-bottom: 28px; }
  .btn { display: inline-block; background: var(--accent); color: #fff; padding: 13px 26px; border-radius: 11px; font-weight: 700; text-decoration: none; font-size: 15px; transition: opacity .2s; }
  .btn:hover { opacity: 0.9; }
  .home { display: block; margin-top: 18px; color: var(--text-dim); font-size: 14px; text-decoration: none; }
  .home:hover { color: var(--text-muted); }
  .brand { display: flex; align-items: center; justify-content: center; gap: 9px; font-weight: 700; margin-bottom: 34px; }
  .brand img { width: 28px; height: 28px; border-radius: 6px; }
  .brand b { background: linear-gradient(135deg, #FF7A1A, #C084FC); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
  <div class="box">
    <div class="brand"><img src="/assets/logo.png" alt="" />Driver<b>Mesh</b></div>
    <div class="icon">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="#EF4444" stroke-width="2.6" stroke-linecap="round"/></svg>
    </div>
    <h1 data-tr="Ödeme tamamlanamadı" data-en="Payment didn't go through">Ödeme tamamlanamadı</h1>
    <p data-tr="İşlem iptal edildi ya da tamamlanamadı. Hiçbir ücret alınmadı — dilersen tekrar deneyebilirsin." data-en="The transaction was cancelled or could not be completed. You were not charged — feel free to try again.">İşlem iptal edildi ya da tamamlanamadı. Hiçbir ücret alınmadı — dilersen tekrar deneyebilirsin.</p>
    <a class="btn" href="/abonelik" data-tr="Tekrar dene" data-en="Try again">Tekrar dene</a>
    <a class="home" href="/" data-tr="Ana sayfaya git" data-en="Go to home">Ana sayfaya git</a>
  </div>
  <script>
    (function () {
      if ((navigator.language || '').startsWith('en')) {
        document.documentElement.lang = 'en';
        document.querySelectorAll('[data-en]').forEach((el) => { el.textContent = el.getAttribute('data-en'); });
      }
    })();
  </script>
</body>
</html>
